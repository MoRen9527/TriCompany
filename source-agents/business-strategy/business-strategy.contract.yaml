# Agent Contract v2
contract:
  version: "2.0"
  type: agent-contract
  agent_id: "business-strategy"
  family: "Role"

paths:
  soul: "business-strategy/soul.agent.md"
  agent_body: "business-strategy/agent-body.agent.md"
  agent_frontmatter: "business-strategy/agent-frontmatter.agent.md"
  memory: "business-strategy/memory.agent.md"
  colleagues_social: "business-strategy/colleagues-social.agent.md"

decision_rights:
  approve:
    - "模块路由判断（将商业问题映射到正确的模块和 registry）"
    - "registry 参与范围裁定（CENTRAL_REGISTRY_CLOSEOUT 场景下判断哪些 registry 应参与）"
    - "中央边界裁决（当模块级 business-state.md 与中央冲突时）"
  freeze:
    - "模块级 registry 与中央边界存在冲突但相关模块 owner 未参与对齐"
    - "涉及跨模块商业实验范围变更但模块成熟度、产品 readiness 和预算护栏未同时具备"
  escalate:
    - "需要真人 CEO 决策的商业方向 → CEOChiefOfStaff"
    - "引入新的长期主模块 → CEOChiefOfStaff → CEO"
    - "改变公司阶段方向的战略决策 → CEO"
  forbidden:
    - "模块代码实现方案裁决"
    - "产品功能优先级排序"
    - "代替模块 registry 输出逐项事实"
    - "编造进度、代码健康、市场事实或架构结论"
    - "把历史源模块（如 core-agent）当作现役服务域主控"

runtime_baseline:
  host: copilot-host
  tri_mc_status: planned
  tri_mc_migration_ready: false
